project:
  type: website
  
website:
  title: "SiPBA Research Lab"  
  description: "SiPBA is a research group at the University of Granada working on statistical signal processing and machine learning applied to medical imaging."
  site-url: https://sipba.github.io/
  image: images/social/sipba-card.jpg
  image-alt: "SiPBA Research Lab: Signal Processing and Biomedical Applications, University of Granada"
  favicon: images/logos/favicon.webp
  open-graph: true
  twitter-card: true
  navbar:
    title: ""
    background: "#1d4f91"
    foreground: "#e0f2fe"
    search: true
    logo: images/logos/SinFondoClaro.png
    right:
      - href: index.qmd
        text: Home
      - href: people.qmd
        text: People
      - href: research.qmd
        text: Research
      - href: transfer.qmd
        text: Transfer
      - publications.qmd
      - posts.qmd
    tools:
      - icon: github
        href: https://github.com/SiPBA
        target: _blank
        aria-label: GitHub
      - icon: envelope-fill
        href: contact.qmd
        aria-label: Contact

format:
  html:
    theme: cosmo
    css: styles.css
    page-layout: full
    grid:
      body-width: 1000px
    include-after-body: _includes/_footer.html
    
execute:
  freeze: auto
