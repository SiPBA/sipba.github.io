      - href: index.qmd
        text: Home
      - href: people.qmd
        text: People
      - href: research.qmd
        text: Research
      - publications.qmd
      - posts.qmd
    tools: 
      - icon: github # add icons as navbar buttons
        href: https://github.com/SiPBA
        target: _blank
      - icon: envelope-fill
        text: ""
        href: contact.qmd
        aria-label: Contact

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    page-layout: full
    grid:
      body-width: 1000px
    
execute:
  freeze: auto
